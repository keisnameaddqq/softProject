    <!-- 沟通服务器，进行查询，并显示结果-->
    <script>
        window.onload = async function() {
            const formData = new FormData(); // 创建一个 FormData 对象
            formData.append('findcontent', findcontent);
            formData.append('userId', userId);
            formData.append('token',token);
            try {
                const response = await fetch("./findarticle", { // 使用 Fetch API 将文件上传到服务器
                    method: 'POST',
                    body: formData,
                });
                const articles = await response.json();
                console.log("articles = "+articles);
                const articleContainer = document.getElementById('articleContainer');
                articleContainer.innerHTML = ''; // 清除先前的内容
                // 处理文章列表
                for (let article of articles) {
                    console.log("articleid="+article[0]);//文章id
                    console.log("authorid="+article[1]);// 文章作者id
                    console.log("title="+article[2]); // 打印文章标题
                    console.log("content="+article[3]); // 打印文章内容
                    console.log("dianzang="+article[4]);// 赞的数量
                    console.log("pinglun="+article[5]);// 评论的数量
                    console.log("isdianzhang="+article[6]);// 是否点赞了
                    console.log("timestampinminutes="+article[7]);// 分钟级别的时间戳
                    console.log("isShouCang="+article[8]);// 是否收藏
                    console.log("authorSignature="+article[9]);// 作者的昵称
                    console.log("authorSignature="+article[10]);// 作者的个性签名
                    //articleId, authorId, title, content, remarkNumber, isDianZhang, agreeNumber, userdata, isShouCang, authorNickName,authorSignature
                    await articleContainer.appendChild(await createArticleDiv(article[0], article[1], article[2], article[3],
                        article[5], article[6], article[4], userdata,article[8],article[9],article[10]));
                    touchup(article[0],"初始");
                    IWantShouCang(article[0],"初始");
                }
            } catch (error) {
                alert('查询出错:', error);
                console.log("查询出错:"+error);
            }
        }
    </script>
