        //分钟级别的时间戳的转换
        function formatTimestampInMinutes(timestampInMinutes) {
            // 将分钟时间戳转换为毫秒
            let timestampInMilliseconds = timestampInMinutes * 60 * 1000;
            // 创建 Date 对象
            let date = new Date(timestampInMilliseconds);
            // 获取年、月、日、小时和分钟
            let year = date.getFullYear();
            let month = ('0' + (date.getMonth() + 1)).slice(-2); // 注意月份是从 0 开始的，所以要加 1
            let day = ('0' + date.getDate()).slice(-2);
            let hours = ('0' + date.getHours()).slice(-2);
            let minutes = ('0' + date.getMinutes()).slice(-2);
            // 构建格式化的时间字符串
            let formattedTimestamp = year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
            return formattedTimestamp;
        }
    </script>
