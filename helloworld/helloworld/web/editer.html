    <!-- 对图片和音频的提交和显示的处理-->
    <script>
        //对文本的属性进行修改
        function formatText(command, value = null) {
            document.execCommand(command, false, value);
        }
        //添加图片
        document.getElementById('uploadButton').addEventListener('click', function () {
            document.getElementById('imageInput').click(); // 触发文件选择
        });
        document.getElementById('imageInput').addEventListener('change', async function () {
            const files = this.files; // 获取选定的文件列表
            if (files.length > 0) {
                const imageContainer = document.getElementById('editor');
                for (let i = 0; i < files.length; i++) {
                    var url = await getPictureUrl(files[i], './loadpicture');
                    if (url != null) {
                        const imageElement = document.createElement('img');
                        imageElement.src = url;
                        imageElement.classList.add('draggable-image');
                        imageElement.style.width = '250px'; // 设置图片宽度
                        imageElement.style.height = '250px'; // 设置图片宽度
                        // imageElement.style.height = '250px'; // 设置图片高度
                        imageContainer.appendChild(imageElement); // 将包装器添加到页面中的指定容器
                    }
                }
            }
        });
        async function getPictureUrl(pictureFile, address) {
            const formData = new FormData(); // 创建一个 FormData 对象
            formData.append('picture', pictureFile);
            try {
                const response = await fetch(address, { // 使用 Fetch API 将文件上传到服务器
                    method: 'POST',
                    body: formData
                });
                const url = await response.text();
                console.log("获取到了" + url);
                return url ;
            } catch (error) {
                alert('上传图片出错:', error);
                return null;
            }
        }
        //添加音频
        document.getElementById('uploadAudioButton').addEventListener('click', function () {
            document.getElementById('audioInput').click(); // 触发音频文件选择
        });
        document.getElementById('audioInput').addEventListener('change', async function () {
            const files = this.files; // 获取选定的音频文件列表
            if (files.length > 0) {
                const audioContainer = document.getElementById('editor');
                for (let i = 0; i < files.length; i++) {
                    var url = await getAudioUrl(files[i], './uploadaudio');
                    if (url != null) {
                        const audioElement = document.createElement('video');
                        audioElement.src = url;
                        audioElement.controls = true; // 显示控制条
                        audioElement.style = "display:inline; max-height: 200px;"; // 使用 style 属性设置样式
                        audioElement.maxheight="100px";
                        audioContainer.innerHTML+="&nbsp";
                        audioContainer.appendChild(audioElement); // 将包装器添加到页面中的指定容器
                        audioContainer.innerHTML+="&nbsp";
                    }
                }
            }
            // 设置焦点回可编辑的div
            document.getElementById('editor').focus();
        });
        async function getAudioUrl(audioFile, address) {
            const formData = new FormData(); // 创建一个 FormData 对象
            formData.append('audio', audioFile);
            formData.append('userId',userId);
            try {
                const response = await fetch(address, {
                    method: 'POST',
                    body: formData
                });
                const url = await response.text();
                console.log("vidio-url="+url)
                return url;
            } catch (error) {
                alert('上传音频出错:', error);
                return null;
            }
        }
    </script>

    <!-- 提交文章到服务器中-->
    <script>
        async function submitArticle(whatevercontinue) {
            var articleContent = document.getElementById('editor').innerHTML;
            var articleTitle = document.getElementById('titleInput').value;
            const formData = new FormData(); // 创建一个 FormData 对象
            formData.append('title', articleTitle);
            formData.append('content', articleContent);
            formData.append('userId',userId);
            formData.append('token',token);
            formData.append('whatevercontinue',whatevercontinue);
            try {
                const response = await fetch('./uploadarticle', { // 使用 Fetch API 将文件上传到服务器
                    method: 'POST',
                    body: formData
                });
                const jieguo = await response.text();
                if(jieguo==='true'){
                    alert("文章成功上传！")
                    console.log('文章成功上传！');
                } else if(jieguo==='title is existing'){
                    console.log('已存在相同标题的文章！');
                    var panduan = confirm("已存在相同标题的文章,是否坚持添加文章？");
                    if(panduan){
                        submitArticle('true');
                    }
                } else if(jieguo==='你的文章中包含’敏感词‘'){
                    console.log('你的文章中包含’敏感词‘');
                    alert("你的文章中包含’敏感词‘");
                } else{
                    console.log("jieguo="+jieguo);
                    alert("文章上传失败！")
                    console.log('文章上传失败！');
                }
            } catch (error) {
                alert('上传文章出错:', error);
                return null;
            }
        }
    </script>
