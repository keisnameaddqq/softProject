<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="./css/style.css" />
  <title>影视产品论坛</title>
</head>

<body>

  <!--特效-->
<!--  <script src="./js/背景特效.js"></script>-->
  <span class="js-cursor-container"></span>
<!--  <script src="./js/鼠标特效.js"></script>-->
<!--  <script src="./js/鼠标声效.js"></script>-->
  <div class="container">
    <h1>请注册</h1>
    <form onsubmit="return EndHandleRegister(this)">
      <div class="form-control">
        <input type="text" required id="email">
        <label for="email">用户名</label>
      </div>
      <div class="form-control">
        <input type="password" required id="password">
        <label for="password">密码</label>
      </div>
      <div class="form-control">
        <input type="tel" required id="telephone">
        <label for="telephone">手机号码</label>
      </div>
      <div class="form-control">
        <input type="text" required id="verificationCode">
        <label for="verificationCode">验证码</label>
        <button type="button" id="getVerificationCode" onclick="startCountdown()">获取验证码</button>
      </div>
      <button class="btn" type="submit">立即注册</button>
      <p class="text">已经拥有一个账户？ <a href="login.html">登录</a>
        <a href="ForgetPassword.html" style="margin-right: 4px;">忘记密码</a>
        <a class="back" href="./index.html">游客登录</a></p>
    </form>
  </div>

  <script src="./js/caozuojs/用户名和密码和电话和哈希格式.js"></script>
  <script>
    //60秒验证码
    var countdown = 60;
    function startCountdown() {
      if (countdown == 0) {
        document.getElementById("getVerificationCode").disabled = false;
        document.getElementById("getVerificationCode").innerHTML = "获取验证码";
        countdown = 60;
      } else {
        document.getElementById("getVerificationCode").disabled = true;
        document.getElementById("getVerificationCode").innerHTML = "重新发送(" + countdown + ")";
        countdown--;
        setTimeout(function() { startCountdown() }, 1000)
      }
    }
    //集成注册接口
    async function EndHandleRegister(form) {
      event.preventDefault();
      console.log("userName=" + form.elements["email"].value +
              "\npassword=" + form.elements["password"].value +
              "\ntelephone=" + form.elements["telephone"].value);
      if (validateUsername(form.elements["email"].value) === false) {
        return false;
      }
      if (validatePassword(form.elements["password"].value) === false) {
        return false;
      }
      if (validatePhoneNumber(form.elements["telephone"].value) === false) {
        return false;
      }
      return await handleRegister(form);
    }
    //发送注册数据
    async function handleRegister(form) {
      const url = "./register";
      try {
        const response = await fetch(url, {
          method: "post",
          body: new URLSearchParams({
            "userName": form.elements["email"].value,
            "password": hashCode(form.elements["password"].value),
            "telephone": form.elements["telephone"].value
          })
        });
        const message = await response.text();
        if (message==="true") {
          alert("注册成功!");
          return true;
        } else {
          alert("注册失败！请重新输入！\n你的用户名或者手机号已经存在！");
          return false;
        }
      } catch (error) {
        alert(error+"\n");
        throw error;
      }
    }
  </script>
  <script>
    //特殊样式的实现
    const labels = document.querySelectorAll('.form-control label')
    labels.forEach(label => {
      label.innerHTML = label.innerText
              .split('')
              .map((letter, idx) => `<span style="transition-delay:${idx * 50}ms">${letter}</span>`)//letter:当前元素的值 idx:当前元素的索引值 transition-delay:何时进行切换
              .join('')
    })
  </script>
</body>

</html>
