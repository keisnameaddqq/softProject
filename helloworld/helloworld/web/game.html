    <div id="mygamecontainer">
        <div class="mygame">
            <h3>石头剪刀布小游戏</h3>
            <button id="shitou" onclick="HandleGame('shitou')">石头</button>
            <button id="jiandao" onclick="HandleGame('jiandao')">剪刀</button>
            <button id="bu" onclick="HandleGame('bu')">布</button>
            <div>
                <span>系统出拳:</span>
                <span id="jieguo"></span>
            </div>
            <div>
                <span>你当前的胜率：</span>
                <span id="shengLv">100</span><span>%</span>
                <span id="duiJuNumber" style="display: none">0</span>
            </div>
        </div>
    </div>

    <script>
        async function HandleGame(clickedButtonId) {
            let zhi = -1; //0剪刀、1石头、2布：三个按钮
            switch (clickedButtonId) { // 根据按钮的ID执行相应的逻辑
                case 'shitou':
                    zhi = 1;
                    console.log('石头按钮被点击');
                    break;
                case 'jiandao':
                    zhi = 0;
                    console.log('剪刀按钮被点击');
                    break;
                case 'bu':
                    zhi = 2;
                    console.log('布按钮被点击');
                    break;
                default:
                    console.log('未知按钮被点击');
                    return;
            }
            const url = "./game";
            try {
                const response = await fetch(url, {
                    method: "post",
                    body: new URLSearchParams({ 'zhi': zhi }) // 使用URLSearchParams创建包含zhi变量的对象
                });
                const message = await response.text();
                console.log("message="+message);
                var jieguo = parseInt(message);
                if (jieguo == 0) {
                    document.getElementById("jieguo").innerHTML = "剪刀";
                } else if (jieguo == 1) {
                    document.getElementById("jieguo").innerHTML = "石头";
                } else if (jieguo == 2) {
                    document.getElementById("jieguo").innerHTML = "布";
                }
                let shengL=document.getElementById("shengLv").innerText;
                let junum=document.getElementById("duiJuNumber").innerText;
                let pp;
                if (jieguo == zhi) {
                    pp=(+junum*shengL+50)/(+junum+1);
                    alert("平局！");
                } else if ((jieguo + 2) % 3 == zhi) {
                    pp=(+junum*shengL)/(+junum+1);
                    alert("你输了！");
                } else if ((jieguo + 1) % 3 == zhi) {
                    pp=(+junum*shengL+100)/(+junum+1);
                    alert("你赢了！");
                }
                document.getElementById("shengLv").innerText=pp;
                document.getElementById("duiJuNumber").innerText=+junum+1;
            } catch (error) {
                console.error(error);
            }
        }
    </script>
