    <script>
        //处理动态模块
        async function GetDongTai(event) {
            // 在这里移除所有列表项的活动状态
            const listItems = document.querySelectorAll('.pppfasdfa li');
            listItems.forEach(item => item.classList.remove('active'));
            // 在这里添加当前点击的列表项的活动状态
            const clickedItem = event.target;  // 如果不传递事件对象，这一行需要删除
            clickedItem.classList.add('active');
            const parentDiv = document.getElementById("fasfdasfasdfsasdfsdfa");// 获取父DIV
            parentDiv.innerHTML = "";
            const childDiv = document.createElement("div");// 创建一个新的子DIV
            childDiv.id = "dongtaidiv";// 设置子DIV的ID
            parentDiv.appendChild(childDiv);// 将子DIV添加到父DIV中
            //沟通服务获取收藏列表,调用getShouCangDiv分装收藏列表
            const formData = new FormData(); // 创建一个FormData对象
            formData.append('userId', userId);
            formData.append('token', token);
            console.log("formData=" + formData);
            try {
                const response = await fetch("./GetMyDongTaiList", {
                    method: 'POST',
                    body: formData,
                });
                //articleId 0 和 authorid 1 和 authorNickname 2 和 title 3 和 dianzang 4 和 pinglun 5 和 timestampinminutes 6
                const dongTaiArticle = await response.json();
                console.log("dongTaiArticle = " + dongTaiArticle);
                if(dongTaiArticle.size==0){
                    childDiv.innerText = "动态";
                }
                for (const Article of dongTaiArticle) {
                    childDiv.innerHTML += getDongTaiDiv(Article[1], Article[0], Article[2], Article[3],
                        formatTimestampInMinutes(Article[6]), Article[4], Article[5],userdata);
                }
            } catch (e) {
                alert("获取动态数据失败！");
            }
        }
    </script>

        //分钟级别的时间戳的转换
        function formatTimestampInMinutes(timestampInMinutes) {
            // 将分钟时间戳转换为毫秒
            let timestampInMilliseconds = timestampInMinutes * 60 * 1000;
            // 创建 Date 对象
            let date = new Date(timestampInMilliseconds);
            // 获取年、月、日、小时和分钟
            let year = date.getFullYear();
            let month = ('0' + (date.getMonth() + 1)).slice(-2); // 注意月份是从 0 开始的，所以要加 1
            let day = ('0' + date.getDate()).slice(-2);
            let hours = ('0' + date.getHours()).slice(-2);
            let minutes = ('0' + date.getMinutes()).slice(-2);
            // 构建格式化的时间字符串
            let formattedTimestamp = year + '-' + month + '-' + day + ' ' + hours + ':' + minutes;
            return formattedTimestamp;
        }

        async function AddPersonImage(need, op = "") {

                await new Promise(resolve => {

                        resolve();
                    }, { once: true });
                    fileInput.click();

                    sendPersonImage(need,"",op);
                }

                for (let i = 0; i < files.length; i++) {
                    sendPersonImage(need,files[i],op);
                }
            }

                        `<img src="${pictureurl}" alt="Person Image" onclick="AddPersonImage('delete', '${pictureurl}')" height="100px">`;
                }
                document.getElementById("fasfdasfasdfsasdfsdfa").appendChild(contentEditableDiv);
            } catch (e) {
                alert("发送图片到服务器失败！");
            }
        }
        document.getElementById("listpp1").click();
