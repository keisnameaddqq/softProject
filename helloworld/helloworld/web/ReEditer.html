<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>影视产品论坛</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .editor-container {
            max-width: 800px;
            margin: 20px auto;
        }

        .editor-toolbar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ccc;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
            border: none;
            background: none;
        }

        #titleInput {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 18px;
        }

        #editor {
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 400px;
        }
    </style>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/bass.css">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/article.css">
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/4.7.0/css/font-awesome.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
</head>
<body>
    <!--特效-->
<!--    <script src="./js/背景特效.js"></script>-->
    <span class="js-cursor-container"></span>
<!--    <script src="./js/鼠标特效.js"></script>-->
<!--    <script src="./js/鼠标声效.js"></script>-->
    <!-- 获取必要的用户信息-->
    <script>
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const token = urlParams.get('token');
        const userId = urlParams.get('userId');
        const articleId = urlParams.get('articleId');
        console.log("token="+token +" userId="+userId+" articleId="+articleId);
        const userdata = "?userId=" + encodeURIComponent(userId) + "&token=" + encodeURIComponent(token);
    </script>

    <!-- 编辑文章的页面设计-->
    <div class="editor-container">
        <div class="editor-toolbar">
            <button onclick="formatText('bold')"><b>B</b></button>
            <button onclick="formatText('italic')"><i>I</i></button>
            <button onclick="formatText('underline')"><u>U</u></button>
            <input type="file" id="imageInput" accept="image/*" style="display: none" multiple>
            <div id="uploadButton">
                <i class="fa fa-file-picture-o"></i>
            </div>
            <input type="file" id="audioInput" accept="audio/*,video/*" style="display: none" multiple>
            <div id="uploadAudioButton">
                <i class="fa fa-file-audio-o"></i>
            </div>
        </div>
        <input type="text" id="titleInput" placeholder="输入标题..." required>
        <div id="editor" contenteditable="true"></div>
        <button onclick="ReEditerArticle()" style="background-color: azure;border: 2px solid black;">确认修改文章</button>
        <button onclick="TurnBack()" style="background-color: azure;border: 2px solid black;float:right;">返回</button>
    </div>

    <!-- 沟通服务器查询文章，初始化输入框的内容-->
    <script>
        window.onload = async function() {
            const formData = new FormData(); // 创建一个 FormData 对象
            formData.append('articleId', articleId);
            formData.append('authorId',userId);
            formData.append('userId', userId);
            formData.append('token',token);
            console.log("formData="+formData);
            try {
                const response = await fetch("./showarticle", { // 使用 Fetch API 将文件上传到服务器
                    method: 'POST',
                    body: formData,
                });
                const articleData = await response.json();console.log("articleData = "+articleData);
                // 访问 articleData 数组中的信息
                const title = articleData[1];
                const content = articleData[2];
                const dianzang = articleData[3];
                const authorName = articleData[4];
                const authorSignature = articleData[5];
                const pinglun = articleData[6];
                const timestampinminutes = articleData[7];
                console.log("ArticleID: " + articleId);console.log("Title: " + title);console.log("Content: " + content);
                console.log("Dianzang: " + dianzang);console.log("AuthorName: " + authorName);console.log("AuthorSignature: " + authorSignature);
                console.log("pinglun: " + pinglun);console.log("timestampinminutes: " + timestampinminutes);
                //设置文章内容
                document.getElementById("titleInput").value =title;
                document.getElementById("editor").innerHTML=content;
            } catch (error) {
                alert('文章获取内容出错:', error);
                console.log("文章获取内容出错:"+error);
            }
        }
    </script>

    <!-- 回退按钮的设计-->
    <script>
        function TurnBack() {
            window.history.back();
        }
    </script>

    <!-- 对图片和音频的提交和显示的处理-->
    <script>
        //对文本的属性进行修改
        function formatText(command, value = null) {
            document.execCommand(command, false, value);
        }
        //添加图片
        document.getElementById('uploadButton').addEventListener('click', function () {
            document.getElementById('imageInput').click(); // 触发文件选择
        });
        document.getElementById('imageInput').addEventListener('change', async function () {
            const files = this.files; // 获取选定的文件列表
            if (files.length > 0) {
                const imageContainer = document.getElementById('editor');
                for (let i = 0; i < files.length; i++) {
                    var url = await getPictureUrl(files[i], './loadpicture');
                    if (url != null) {
                        const imageElement = document.createElement('img');
                        imageElement.src = url;
                        imageElement.classList.add('draggable-image');
                        imageElement.style.width = '250px'; // 设置图片宽度
                        // imageElement.style.height = '250px'; // 设置图片高度
                        imageContainer.appendChild(imageElement); // 将包装器添加到页面中的指定容器
                    }
                }
            }
        });
        async function getPictureUrl(pictureFile, address) {
            const formData = new FormData(); // 创建一个 FormData 对象
            formData.append('picture', pictureFile);
            try {
                const response = await fetch(address, { // 使用 Fetch API 将文件上传到服务器
                    method: 'POST',
                    body: formData
                });
                const url = await response.text();
                console.log("获取到了" + url);
                return url ;
            } catch (error) {
                alert('上传图片出错:', error);
                return null;
            }
        }
        //添加音频
        document.getElementById('uploadAudioButton').addEventListener('click', function () {
            document.getElementById('audioInput').click(); // 触发音频文件选择
        });
        document.getElementById('audioInput').addEventListener('change', async function () {
            const files = this.files; // 获取选定的音频文件列表
            if (files.length > 0) {
                const audioContainer = document.getElementById('editor');
                for (let i = 0; i < files.length; i++) {
                    var url = await getAudioUrl(files[i], './uploadaudio');
                    if (url != null) {
                        const audioElement = document.createElement('video');
                        audioElement.src = url;
                        audioElement.controls = true; // 显示控制条
                        audioElement.style = "display:inline; max-height: 200px;"; // 使用 style 属性设置样式
                        audioElement.maxheight="100px";
                        audioContainer.innerHTML+="&nbsp";
                        audioContainer.appendChild(audioElement); // 将包装器添加到页面中的指定容器
                        audioContainer.innerHTML+="&nbsp";
                    }
                }
            }
            // 设置焦点回可编辑的div
            document.getElementById('editor').focus();
        });
        async function getAudioUrl(audioFile, address) {
            const formData = new FormData(); // 创建一个 FormData 对象
            formData.append('audio', audioFile);
            formData.append('userId',userId);
            try {
                const response = await fetch(address, {
                    method: 'POST',
                    body: formData
                });
                const url = await response.text();
                console.log("vidio-url="+url)
                return url;
            } catch (error) {
                alert('上传音频出错:', error);
                return null;
            }
        }
    </script>

    <!-- 修改服务器中的文章-->
    <script>
        async function ReEditerArticle() {
            var articleContent = document.getElementById('editor').innerHTML;
            var articleTitle = document.getElementById('titleInput').value;
            const formData = new FormData(); // 创建一个 FormData 对象
            formData.append('title', articleTitle);
            formData.append('content', articleContent);
            formData.append('articleId',articleId);
            formData.append('userId',userId);
            formData.append('token',token);
            try {
                const response = await fetch('./ReEditerArticle', { // 使用 Fetch API 将文件上传到服务器
                    method: 'POST',
                    body: formData
                });
                const jieguo = await response.text();
                if(jieguo==='true'){
                    alert("文章重新编辑上传成功！")
                    console.log('文章重新编辑上传成功！');
                    window.location.href = "finishlogin.html"+userdata;
                } else if(jieguo==='你的文章中包含’敏感词‘'){
                    console.log('你的文章中包含’敏感词‘');
                    alert("你的文章中包含’敏感词‘");
                } else{
                    console.log("jieguo="+jieguo);
                    alert("文章重新编辑上传失败！");
                    console.log('文章重新编辑上传失败！');
                }
            } catch (error) {
                alert('文章重新编辑上传出错:', error);
                return null;
            }
        }
    </script>

</body>
</html>
