#配置根节点rootLogger，第一个参数INFO为日志信息的级别，第二个参数rolling_file为指定的输出到文件，第三个参数consol为指定的输出到控制台
log4j.rootLogger=ALL,rolling_file,console

#配置ConsoleAppender的输出方式（位置、目的） 输出到控制台, console是我们自己命名的appenderName
log4j.appender.console=org.apache.log4j.ConsoleAppender
#配置输出到文件中的格式
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%p] %m%n

#配置RollingFileAppender的输出方式（位置、目的） 输出到文件, rolling_file是我们自己命名的appenderName
log4j.appender.rolling_file=org.apache.log4j.RollingFileAppender
#配置输出到文件中的格式
log4j.appender.rolling_file.layout=org.apache.log4j.PatternLayout
log4j.appender.rolling_file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%p] %m%n


#指定文件日志信息的存储位置(出现中文路径回导致很多问题)
log4j.appender.rolling_file.file=src\\day.txt
#配置输出字符编码
log4j.appender.rolling_file.encoding=UTF-8
#指定拆分日志文件的大小
log4j.appender.rolling_file.maxFileSize=1MB
#指定拆分日志文件的数量
log4j.appender.rolling_file.maxBackupIndex=20


